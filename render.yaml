# Blueprint: deploys the Flask API and the built React client together.
# Render -> New -> Blueprint -> pick this repo. Both services are free tier.
#
# After the first deploy, set monsoon-client's VITE_API_URL to the API's URL
# (e.g. https://monsoon-api.onrender.com) and redeploy the client. It is baked
# into the bundle at build time, so it needs a rebuild to take effect.
services:
  - type: web
    name: monsoon-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: FLASK_DEBUG
        value: "0"
      - key: CORS_ORIGINS
        value: "*"          # tighten to the client URL once it is live

  - type: web
    name: monsoon-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # set this by hand in the dashboard after the API deploys
    routes:
      # SPA fallback so /destination/madurai and /bookings survive a hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html
